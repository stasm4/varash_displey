name: Minecraft mods

on:
  push:
    paths:
      - 'minecraft-mods/**'
      - '.github/workflows/minecraft-mods.yml'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: [EnhancedCampfire]
    defaults:
      run:
        working-directory: minecraft-mods/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.project }}-${{ hashFiles(format('minecraft-mods/{0}/*.gradle', matrix.project), format('minecraft-mods/{0}/gradle.properties', matrix.project)) }}
          restore-keys: gradle-${{ matrix.project }}-

      - name: Build (compile + reobfuscated jar)
        run: chmod +x gradlew && ./gradlew build --stacktrace --no-daemon

      - name: GameTests on a headless Forge server
        run: ./gradlew runGameTestServer --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-jar
          path: minecraft-mods/${{ matrix.project }}/build/libs/*.jar

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.project }}-logs
          path: |
            minecraft-mods/${{ matrix.project }}/run/logs/
            minecraft-mods/${{ matrix.project }}/build/reports/
          if-no-files-found: ignore
